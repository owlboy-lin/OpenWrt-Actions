name: BLLW-immortalwrt-25.12-mosdns-test

permissions:
  contents: write
  actions: write

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    # UTC 12:00 = 北京时间 20:00，每周五自动编译
    - cron: 0 12 * * 5

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  FREE_DISK_SH: scripts/free_disk_space.sh
  ENV_SH: scripts/environment.sh
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  PLATFORM_FILE: configs/My-Target-X86-Actions-immortalwrt.txt
  CONFIG_FILE: configs/Packages-immortalwrt-25.12-mosdns.txt
  SETTINGS_SH: scripts/BLLW-init-settings-test.sh
  PACKAGES_SH: scripts/packages-immortalwrt-mosdns-test.sh
  CLASH_CORE_SH: scripts/preset-clash-core-amd64.sh
  RUST_SH: scripts/rust.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 初始化编译环境 & 清理磁盘
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          chmod +x $FREE_DISK_SH && $FREE_DISK_SH
          chmod +x $ENV_SH && $ENV_SH
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 查看磁盘空间
        if: (!cancelled())
        run: df -hT

      - name: 克隆 ImmortalWrt 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL --depth 1 -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          cd ./openwrt/
          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
          # 移除国内镜像源，GA环境避免网络异常
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: 缓存 toolchain & ccache
        id: check-cache
        uses: actions/cache@v5.0.5
        with:
          key: x86-${{env.REPO_BRANCH}}-${{env.WRT_HASH}}
          restore-keys: |
            x86-${{env.REPO_BRANCH}}
          path: |
            ./openwrt/.ccache
            ./openwrt/staging_dir/host*
            ./openwrt/staging_dir/tool*

      - name: 启用 CCACHE
        run: |
          echo 'CONFIG_DEVEL=y' >> openwrt/.config
          echo 'CONFIG_CCACHE=y' >> openwrt/.config

      - name: 缓存时间戳更新
        run: |
          if [ -d "./openwrt/staging_dir" ]; then
            find "./openwrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done
            mkdir -p ./openwrt/tmp && echo "1" > ./openwrt/tmp/.build
            echo "toolchain skip done!"
          else
            echo "cache miss!"
          fi

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 导入配置、补丁、执行DIY脚本
        run: |
          [ -d files ] && mv files openwrt/files || echo "files 目录不存在，跳过"
          # 改成覆盖写入，避免重复CONFIG_（重点修复）
          > openwrt/.config
          [ -f $PLATFORM_FILE ] && cat $PLATFORM_FILE >> openwrt/.config
          [ -f $CONFIG_FILE ] && cat $CONFIG_FILE >> openwrt/.config
          chmod +x $RUST_SH && $RUST_SH
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/$SETTINGS_SH && $GITHUB_WORKSPACE/$SETTINGS_SH
          chmod +x $GITHUB_WORKSPACE/$PACKAGES_SH && $GITHUB_WORKSPACE/$PACKAGES_SH
          chmod +x $GITHUB_WORKSPACE/$CLASH_CORE_SH && $GITHUB_WORKSPACE/$CLASH_CORE_SH
          # 归一化配置
          make defconfig

      - name: 下载源码包
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译前磁盘
        if: (!cancelled())
        run: df -hT

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          make defconfig
          echo "$(nproc) 线程编译"
          make -j$(nproc) || make -j$(( $(nproc)/2 + 1 )) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 编译后磁盘
        if: (!cancelled())
        run: df -hT

      - name: 上传bin完整目录
        uses: actions/upload-artifact@v7.0.1
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin_X86_${{ env.REPO_BRANCH }}_${{ github.sha }}
          path: openwrt/bin

      - name: 整理固件目录
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf *.buildinfo *.json *.manifest packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件artifact
        uses: actions/upload-artifact@v7.0.1
        if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_img_X86_${{ env.REPO_BRANCH }}_${{ github.sha }}
          path: ${{ env.FIRMWARE }}

      - name: 生成Release标签和说明
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          VERSION1="${REPO_BRANCH#*-}"
          FILE_DATE=$(date +"%Y.%m.%d")
          echo "FILE_DATE=$FILE_DATE" >> $GITHUB_ENV
          echo -e "🎉 X86-64 平台\n✅ ImmortalWrt ${VERSION1} 源码\n❗️ 默认IP : 192.168.8.1" > release.txt
          echo "release_tag=${FILE_DATE}-${VERSION1}_X86-64" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 发布Release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      # 可选：自动保留最近3个release，旧的删除（需要单独RELEASES_TOKEN，repo权限）
      - name: 删除旧Release
        if: steps.tag.outputs.status == 'success' && !cancelled()
        uses: MedyMa/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
          delete_tag_pattern: '^.*-25\.12_X86-64$'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
