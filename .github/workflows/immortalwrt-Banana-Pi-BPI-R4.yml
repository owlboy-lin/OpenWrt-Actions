name: immortalwrt-Banana-Pi-BPI-R4-test

on:
  schedule:
    - cron: 0 20 * * *

  release:
    types: [published]
  
  watch:
    types: [started]


  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
        
      CACHE_BUILD:
        description: '缓存加速'
        required: false
        default: 'true'
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: bpi-r4/immortalwrt/mediatek/defconfig
  DIY_P1_SH: immortalwrt/diy-part1.sh
  DIY_P2_SH: immortalwrt/diy-part2-1.sh
  Firmware_Name: immortalwrt-Banana-Pi-BPI-R4-test
  DIR: bpi-r4
  OPENWRT_NAME: immortalwrt
  OPENWRT_DEVICE: mediatek
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  UPLOAD_BIN_DIR: false
  UPLOAD_BUILDINFO: true
  UPLOAD_PACKAGE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GIT_USER_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'

    - name: Check out the project branch
      uses: actions/checkout@main

    - name: Initialize the compilation environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        ( sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex g++ gawk gcc-multilib gettext \
        git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libpython3-dev aria2 jq subversion qemu-utils ccache rename libelf-dev
        sudo -E apt-get -qq purge azure-cli ghc* zulu* hhvm llvm* firefox powershell openjdk* dotnet* google* mysql* php* android* rename speedtest-cli
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean ) &
        sudo timedatectl set-timezone "$TZ" || true
        
    - name: Initialize Environment and Display System Info
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x $DIR/$OPENWRT_NAME/*.sh
        $GITHUB_WORKSPACE/$DIR/$OPENWRT_NAME/system-Information.sh
        
    - name: Download firmware source code
      run: |
        git clone --filter=blob:none --single-branch -c core.abbrev=7 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        git log --pretty=tformat:"%h" -n1 tools toolchain || echo "No toolchain history"


    - name: Generate cache keys
      id: cache-key
      run: |
        echo "ccache_period=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Restore toolchain cache
      uses: klever1988/cachewrtbuild@54ed4fe2f7d8b5cfbc0b928c159266ee892c2d3d
      with:
        ccache: 'false'
        prefix: ${{ github.workspace }}/openwrt
        mixkey: ${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v5.0.5
      with:
        path: openwrt/.ccache
        key: ccache-${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}-${{ steps.cache-key.outputs.ccache_period }}
        restore-keys: |
          ccache-${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}-

    - name: Update & install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load feeds.conf.default
      run: |
        chmod +x $DIR/$OPENWRT_NAME/*.sh
        cd openwrt
        $GITHUB_WORKSPACE/$DIR/$DIY_P1_SH

    - name: Load config
      run: |
        [ -e "$CONFIG_FILE" ] && cat "$CONFIG_FILE" > openwrt/.config
        chmod +x $DIR/$OPENWRT_NAME/*.sh && cd openwrt
        $GITHUB_WORKSPACE/$DIR/$DIY_P2_SH

    - name: Download the installation package
      id: package
      run: |
        cd openwrt
        make defconfig
        grep -qx 'CONFIG_PACKAGE_rpcd-mod-router-status=y' .config || {
          echo 'Independent router status package is missing from the resolved firmware configuration' >&2
          exit 1
        }
        cat .config
        make download -j$(nproc) 2>&1
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   


    - name: Compile the firmware
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j$(($(nproc)/2 + 1)) || make -j1 V=s
        CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache --show-stats
        du -sh .ccache
        echo "status=success" >> $GITHUB_OUTPUT
              
    - name: Set the current date
      id: date
      run: |
        cd openwrt
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "date1=$(date +'%Y.%m.%d-%H.%M')" >> $GITHUB_ENV
        echo "date2=$(date "+%Y年%m月%d日-%H点%M分")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Save ccache
      if: steps.compile.outputs.status == 'success' && steps.ccache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5.0.5
      with:
        path: openwrt/.ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

    - name: Prune old caches
      if: steps.compile.outputs.status == 'success' && !cancelled()
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        CACHE_SCOPE: ${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}
        CCACHE_PREFIX: ccache-${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}-
        TOOLCHAIN_PREFIX: ${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}-cache-openwrt-
        CURRENT_CCACHE_KEY: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const scope = process.env.CACHE_SCOPE;
          const ccachePrefix = process.env.CCACHE_PREFIX;
          const toolchainPrefix = process.env.TOOLCHAIN_PREFIX;
          const currentCcacheKey = process.env.CURRENT_CCACHE_KEY;

          const caches = [];
          for (let page = 1; ; page += 1) {
            const response = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
              owner,
              repo,
              per_page: 100,
              page,
            });

            const pageCaches = response.data.actions_caches || [];
            caches.push(...pageCaches);
            if (pageCaches.length < 100) {
              break;
            }
          }

          const byNewest = (left, right) => {
            const leftTime = new Date(left.last_accessed_at || left.created_at || 0).getTime();
            const rightTime = new Date(right.last_accessed_at || right.created_at || 0).getTime();
            return rightTime - leftTime;
          };

          const ccacheCaches = caches
            .filter((cache) => (cache.key || '').startsWith(ccachePrefix))
            .sort(byNewest);
          const staleCcacheCaches = ccacheCaches.filter((cache) => cache.key !== currentCcacheKey);

          const toolchainCaches = caches
            .filter((cache) => {
              const key = cache.key || '';
              return key.startsWith(toolchainPrefix);
            })
            .sort(byNewest);
          const staleToolchainCaches = toolchainCaches.slice(1);

          const staleCaches = [...staleCcacheCaches, ...staleToolchainCaches];
          if (staleCaches.length === 0) {
            core.info(
              `No stale caches to delete for prefixes: ${ccachePrefix} , ${toolchainPrefix}`
            );
            return;
          }

          const deletedPrefixes = [...new Set(
            staleCaches.map((cache) => {
              const key = cache.key || '';
              if (key.startsWith(ccachePrefix)) {
                return ccachePrefix;
              }
              if (key.startsWith(toolchainPrefix)) {
                return toolchainPrefix;
              }
              return `unmatched:${scope}`;
            })
          )];

          core.info(`Deleting stale caches for key prefixes: ${deletedPrefixes.join(', ')}`);

          for (const cache of staleCaches) {
            const prefix = (cache.key || '').startsWith(ccachePrefix) ? ccachePrefix : toolchainPrefix;
            core.info(`Deleting cache with prefix ${prefix}: ${cache.key} (${cache.id})`);
            await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {
              owner,
              repo,
              cache_id: cache.id,
            });
          }

          core.info(
            `Deleted ${staleCaches.length} stale cache(s). ` +
            `Kept ccache key: ${currentCcacheKey || 'none'}. ` +
            `Kept toolchain cache count: ${toolchainCaches.length > 0 ? 1 : 0}. ` +
            `Tracked prefixes: ${ccachePrefix}, ${toolchainPrefix}.`
          );

    - name: 清理旧的CI运行记录
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        KEEP_RUNS: '15'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const keepRuns = parseInt(process.env.KEEP_RUNS || '15', 10);
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const thisRunId = context.runId;
          const wfPath = `.github/workflows/${context.workflow}`;

          // List completed runs of this workflow, newest first.
          const runs = [];
          for (let page = 1; ; page += 1) {
            const response = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs?per_page=100&page={page}',
              { owner, repo, page }
            );
            const pageRuns = (response.data.workflow_runs || [])
              .filter((run) => run.path === wfPath && run.status === 'completed')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            runs.push(...pageRuns);
            if ((response.data.workflow_runs || []).length < 100) break;
          }

          const toDelete = runs.filter((run) => run.id !== thisRunId).slice(keepRuns);
          core.info(
            `[run-cleanup] ${runs.length} completed runs of this workflow; keeping newest ${keepRuns}, deleting ${toDelete.length}`
          );
          for (const run of toDelete) {
            core.info(`[run-cleanup] deleting run ${run.id} (${run.name}) from ${run.created_at}`);
            await github.request('DELETE /repos/{owner}/{repo}/actions/runs/{run_id}', {
              owner,
              repo,
              run_id: run.id,
            });
          }

    - name: Organize and Rename Files
      id: organize
      if: ${{ env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
      run: |
        cd openwrt/bin/targets/mediatek/filogic
        rm -rf packages *mt798* *.config *.buildinfo *.json sha256sums 
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        
    # - name: Upload the firmware to github
    #   uses: actions/upload-artifact@main
    #   if: steps.organize.outputs.status == 'success' && !cancelled()
    #   with:
    #     name: ${{ env.date1 }}_${{ env.Firmware_Name }}_${{ env.OPENWRT_DEVICE }}
    #     path: ${{ env.FIRMWARE }}


    - name: 整理固件文件
      id: artifact
      if: steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        mkdir -p ./artifact/firmware
        mkdir -p ./artifact/package
        mkdir -p ./artifact/buildinfo
        rm -rf $(find ./bin/targets/ -type d -name "packages")
        cp -rf $(find ./bin/targets/ -type f) ./artifact/firmware/
        cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/
        cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/
        cp -rf ./.config ./artifact/buildinfo/${{ env.Firmware_Name }}.info
        cp -rf ./.config ./artifact/firmware/${{ env.Firmware_Name }}.info
        cp -rf ./feeds.conf.default ./artifact/buildinfo/ 
        cd artifact/firmware/
        rename "s/openwrt/${{ env.Firmware_Name }}/" *
        
      
    - name: 上传固件
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.Firmware_Name }}_firmware_${{ env.date1 }}
        path: openwrt/artifact/firmware/

    - name: 上传配置文件
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_BUILDINFO == 'true' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.Firmware_Name }}_buildinfo_${{ env.date1 }}
        path: openwrt/artifact/buildinfo/

    - name: 上传插件
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_PACKAGE == 'true' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.Firmware_Name }}_package_${{ env.date1 }}
        path: openwrt/artifact/package/

    - name: Generate release tags
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${{ env.date2 }}" >> $GITHUB_OUTPUT
        touch release.txt
        echo "📥 固件下载 ${{ env.date1 }}_${{ env.Firmware_Name }}_${{ env.OPENWRT_DEVICE }}" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Publish to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ env.FIRMWARE }}/*
        name: ${{ env.date3 }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
