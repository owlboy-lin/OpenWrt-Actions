name: immortalwrt-Banana-Pi-BPI-R4

on:
  schedule:
    - cron: 0 20 * * *

  release:
    types: [published]
  
  watch:
    types: [started]


  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
        
      CACHE_BUILD:
        description: '缓存加速'
        required: false
        default: 'true'
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: bpi-r4/immortalwrt/mediatek/defconfig
  DIY_P1_SH: immortalwrt/diy-part1.sh
  DIY_P2_SH: immortalwrt/diy-part2-1.sh
  Firmware_Name: immortalwrt-Banana-Pi-BPI-R4
  DIR: bpi-r4
  OPENWRT_NAME: immortalwrt
  OPENWRT_DEVICE: mediatek
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  UPLOAD_BIN_DIR: false
  UPLOAD_BUILDINFO: true
  UPLOAD_PACKAGE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GIT_USER_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        # /mnt may share /; leave space for cache archives after both allocations.
        root-reserve-mb: 16384
        temp-reserve-mb: 8192
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true

    - name: Check out the project branch
      uses: actions/checkout@v6.0.2

    - name: Initialize the compilation environment
      run: |
        set -euo pipefail

        export DEBIAN_FRONTEND=noninteractive
        sudo -E apt-get -qq update
        sudo -E apt-get -y -qq install --no-install-recommends \
            build-essential clang bison flex gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev swig libpython3-dev aria2 jq subversion \
            qemu-utils ccache rename libelf-dev file patch xz-utils zstd
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "${TZ:-Asia/Shanghai}" || true

    - name: Initialize Environment and Display System Info
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x $OPENWRT_NAME/*.sh
        $GITHUB_WORKSPACE/$OPENWRT_NAME/system-Information.sh

    - name: Download firmware source code
      run: |
        git clone --filter=blob:none --single-branch -c core.abbrev=7 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        git log --pretty=tformat:"%h" -n1 tools toolchain || echo "No toolchain history"

    - name: Generate cache keys
      id: cache-key
      run: |
        echo "ccache_period=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Restore toolchain cache
      uses: klever1988/cachewrtbuild@54ed4fe2f7d8b5cfbc0b928c159266ee892c2d3d
      with:
        ccache: 'false'
        prefix: ${{ github.workspace }}/openwrt
        mixkey: ${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v5.0.5
      with:
        path: openwrt/.ccache
        key: ccache-${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}-${{ steps.cache-key.outputs.ccache_period }}
        restore-keys: |
          ccache-${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}-

    - name: Update base feed indexes
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a

    - name: Load feeds.conf.default
      run: |
        chmod +x $DIR/$OPENWRT_NAME/*.sh
        cd openwrt
        $GITHUB_WORKSPACE/$DIR/$DIY_P1_SH

    - name: Load config
      run: |
        [ -e "$CONFIG_FILE" ] && cat "$CONFIG_FILE" > openwrt/.config
        chmod +x $DIR/$OPENWRT_NAME/*.sh && cd openwrt
        $GITHUB_WORKSPACE/$DIR/$DIY_P2_SH

    - name: Download the installation package
      id: package
      run: |
        cd openwrt
        make defconfig
        grep -qx 'CONFIG_PACKAGE_rpcd-mod-router-status=y' .config || {
          echo 'Independent router status package is missing from the resolved firmware configuration' >&2
          exit 1
        }
        cat .config
        make download -j$(nproc) 2>&1
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j$(($(nproc)/2 + 1)) || make -j1 V=s
        CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache --show-stats
        du -sh .ccache
        cd openwrt
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "date1=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
        echo "date2=$(date "+%Y年%m月%d日")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT


    - name: Save ccache
      if: steps.compile.outputs.status == 'success' && steps.ccache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5.0.5
      with:
        path: openwrt/.ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

    - name: Prune old caches
      if: steps.compile.outputs.status == 'success' && !cancelled()
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        CCACHE_PREFIX: ccache-${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}-
        TOOLCHAIN_PREFIX: ${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}-cache-openwrt-
        CURRENT_CCACHE_KEY: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { owner, repo } = context.repo;
          const ccachePrefix = process.env.CCACHE_PREFIX;
          const toolchainPrefix = process.env.TOOLCHAIN_PREFIX;
          const currentKey = process.env.CURRENT_CCACHE_KEY || '';
          if (!ccachePrefix || !toolchainPrefix)
            throw new Error('Cache prefixes are required');

          const caches = [];
          for (let page = 1; ; page++) {
            const response = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
              owner, repo, per_page: 100, page,
            });
            const rows = response.data.actions_caches || [];
            caches.push(...rows);
            if (rows.length < 100) break;
          }

          const newest = (a, b) => new Date(b.last_accessed_at || b.created_at || 0)
            - new Date(a.last_accessed_at || a.created_at || 0);
          const toolchains = caches.filter(c => (c.key || '').startsWith(toolchainPrefix)).sort(newest);
          // A missing restore output must not evict every ccache entry.
          const staleCcache = currentKey.startsWith(ccachePrefix)
            ? caches.filter(c => (c.key || '').startsWith(ccachePrefix) && c.key !== currentKey) : [];
          const stale = [...staleCcache, ...toolchains.slice(1)];
          for (const cache of stale) {
            core.info(`Deleting cache ${cache.key} (${cache.id})`);
            await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {
              owner, repo, cache_id: cache.id,
            });
          }
          core.info(`Deleted ${stale.length} stale build cache(s)`);

    - name: 清理旧的CI运行记录
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        KEEP_RUNS: '15'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { owner, repo } = context.repo;
          const keep = Number(process.env.KEEP_RUNS || '15');
          if (!Number.isInteger(keep) || keep < 1)
            throw new Error('KEEP_RUNS must be a positive integer');

          const current = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}', {
            owner, repo, run_id: context.runId,
          });
          const workflow_id = current.data.workflow_id;
          if (!workflow_id) throw new Error('Current workflow ID is missing');
          const runs = [];
          for (let page = 1; ; page++) {
            const response = await github.request('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs', {
              owner, repo, workflow_id, status: 'completed', per_page: 100, page,
            });
            const rows = response.data.workflow_runs || [];
            runs.push(...rows.filter(run => run.status === 'completed' && run.id !== context.runId));
            if (rows.length < 100) break;
          }
          runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          for (const run of runs.slice(keep)) {
            core.info(`Deleting completed run ${run.id} from ${run.created_at}`);
            await github.request('DELETE /repos/{owner}/{repo}/actions/runs/{run_id}', {
              owner, repo, run_id: run.id,
            });
          }
          core.info(`Kept ${Math.min(keep, runs.length)} completed runs; deleted ${Math.max(0, runs.length - keep)}`);

    - name: Organize and Rename Files
      id: organize
      if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
      run: |
        cd openwrt/bin/targets/mediatek/filogic
        rm -rf packages *mt798* *.config *.buildinfo *.json sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # - name: Upload the firmware to github
    #   uses: actions/upload-artifact@v7.0.1
    #   if: steps.organize.outputs.status == 'success' && !cancelled()
    #   with:
    #     name: ${{ env.date1 }}_${{ env.OPENWRT_NAME }}_${{ env.OPENWRT_DEVICE }}_${{ env.REPO_BRANCH }}
    #     path: ${{ env.FIRMWARE }}


    - name: 整理固件文件
      id: artifact
      if: steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        mkdir -p ./artifact/firmware
        mkdir -p ./artifact/package
        mkdir -p ./artifact/buildinfo
        rm -rf $(find ./bin/targets/ -type d -name "packages")
        cp -rf $(find ./bin/targets/ -type f) ./artifact/firmware/
        cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/
        cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/
        cp -rf ./.config ./artifact/buildinfo/${{ env.Firmware_Name }}.info
        cp -rf ./.config ./artifact/firmware/${{ env.Firmware_Name }}.info
        cp -rf ./feeds.conf.default ./artifact/buildinfo/ 
        cd artifact/firmware/
        rename "s/openwrt/${{ env.Firmware_Name }}/" *
        
      
    - name: 上传固件
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.Firmware_Name }}_firmware_${{ env.date1 }}
        path: openwrt/artifact/firmware/

    - name: 上传配置文件
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_BUILDINFO == 'true' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.Firmware_Name }}_buildinfo_${{ env.date1 }}
        path: openwrt/artifact/buildinfo/

    - name: 上传插件
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_PACKAGE == 'true' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.Firmware_Name }}_package_${{ env.date1 }}
        path: openwrt/artifact/package/

    - name: Generate release tags
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${{ env.date2 }}" >> $GITHUB_OUTPUT
        touch release.txt
        echo "📥 固件下载 ${{ env.date1 }}_${{ env.Firmware_Name }}_${{ env.OPENWRT_DEVICE }}" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Publish to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ env.FIRMWARE }}/*
        name: ${{ env.date3 }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
